name: Miniapp CI

on:
  push:
    branches: [main, master]
    paths:
      - "frontend-miniapp/**"
      - ".github/workflows/miniapp-ci.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "frontend-miniapp/**"
      - ".github/workflows/miniapp-ci.yml"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-miniapp

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend-miniapp/.nvmrc
          cache: "npm"
          cache-dependency-path: frontend-miniapp/package-lock.json

      - name: Install
        run: npm install

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm run test

      - name: Install Playwright (mobile browsers)
        run: npx playwright install --with-deps chromium webkit

      - name: E2E — mobile viewports (Pixel 7 + iPhone 12)
        run: npm run test:e2e

      - name: Upload Playwright report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: miniapp-playwright-report
          path: frontend-miniapp/playwright-report/
          retention-days: 7

      - name: Upload Playwright traces (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: miniapp-playwright-test-results
          path: frontend-miniapp/test-results/
          retention-days: 7
